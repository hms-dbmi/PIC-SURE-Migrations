name: AIO deployment migration proof

on:
  push:
    branches: [main]
    paths:
      - 'Baseline/auth/**'
      - 'Baseline/picsure/**'
      - 'tests/aio-deployment-migration/**'
      - 'tests/banner-authorization-migration/**'
      - 'tests/banner-version-migration/**'
      - '.github/workflows/aio-deployment-migration.yml'
  pull_request:
    paths:
      - 'Baseline/auth/**'
      - 'Baseline/picsure/**'
      - 'tests/aio-deployment-migration/**'
      - 'tests/banner-authorization-migration/**'
      - 'tests/banner-version-migration/**'
      - '.github/workflows/aio-deployment-migration.yml'

permissions:
  contents: read

jobs:
  mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Prove AIO deployment-owned banner migrations
        run: tests/aio-deployment-migration/test.sh all
